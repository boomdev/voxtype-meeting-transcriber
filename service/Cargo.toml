[package]
name = "voxtype-meeting-service"
version = "0.2.0"
edition = "2021"
description = "Durable meeting capture for Voxtype Meeting Transcriber"
license = "MIT"
publish = false

[[bin]]
name = "voxtype-meeting-service"
path = "src/main.rs"

[lib]
name = "voxtype_meeting_service"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4", features = ["derive"] }
claxon = "0.4"
flacenc = "0.5"
pulse = { package = "libpulse-binding", version = "2" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "sync", "time", "signal", "process", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tokio-util = { version = "0.7", features = ["rt"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util", "time", "net", "io-util"] }
